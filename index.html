<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy Lite</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f9;
            text-align: center;
        }
        header {
            background: #172554;
            color: white;
            padding: 25px;
        }
        .products {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 30px;
        }
        .card {
            background: white;
            padding: 25px;
            width: 200px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <header>
        <h1>ShopEasy Lite</h1>
        <p>Your simple online shopping destination</p>
    </header>
    <p>Version 2 - New Release!</p>
    <h2>Our Products</h2>
    <div class="products">
        <div class="card">
            <h3>Smartphone</h3>
            <p>Price: ?15,000</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <h3>Headphones</h3>
            <p>Price: ?2,000</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <h3>Smart Watch</h3>
            <p>Price: ?3,000</p>
            <button>Buy Now</button>
        </div>
    </div>
</body>
</html>
